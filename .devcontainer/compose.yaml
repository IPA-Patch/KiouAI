services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: --no-deprecation
      NODE_ENV: development
    tty: true
    stdin_open: true

